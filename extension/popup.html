<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Calendar Link Generator</h1>

    <div id="status" class="status"></div>

    <div id="event-preview" class="event-preview hidden">
      <h2 id="event-title"></h2>
      <div class="detail"><span class="label">When:</span> <span id="event-when"></span></div>
      <div class="detail" id="event-location-row"><span class="label">Where:</span> <span id="event-location"></span></div>
      <div class="detail" id="event-description-row"><span class="label">Details:</span> <span id="event-description"></span></div>

      <button id="generate-btn" class="btn-primary">Generate Link</button>
    </div>

    <div id="results" class="results hidden">
      <div class="calendar-links">
        <button id="btn-copy-google" class="btn-calendar btn-google btn-copy-url" data-url-type="google">Copy Google URL</button>
        <button id="btn-copy-outlook" class="btn-calendar btn-outlook btn-copy-url" data-url-type="outlook">Copy Outlook URL</button>
        <button id="btn-copy-ics" class="btn-calendar btn-ics btn-copy-url" data-url-type="ics">Copy iCal URL</button>
      </div>

      <div class="result-group">
        <div class="snippet-header">
          <label>Paste into email</label>
          <div class="toggles-group">
            <div class="toggle-row">
              <span class="toggle-label">Include iCal</span>
              <label class="switch">
                <input type="checkbox" id="ics-toggle" checked>
                <span class="slider"></span>
              </label>
            </div>
            <div class="toggle-row">
              <span class="toggle-label">Raw HTML</span>
              <label class="switch">
                <input type="checkbox" id="raw-toggle">
                <span class="slider"></span>
              </label>
            </div>
          </div>
        </div>
        <div id="rich-preview" class="rich-preview"></div>
        <textarea id="html-snippet" class="hidden" readonly rows="3"></textarea>
        <button id="btn-copy-rich" class="btn-copy-rich">Copy for Email</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
